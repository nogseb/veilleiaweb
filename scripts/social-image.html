<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Barlow Condensed'; font-weight: 400; src: url('__FONT_DATA_URI__') format('truetype'); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #F5F4F0; }
main { width: 1200px; aspect-ratio: 1; display: grid; place-content: center; text-align: center; padding: 240px; color: #0F0F10; font-family: 'Barlow Condensed', sans-serif; font-weight: 400; }
.content { width: 720px; }
.label { margin: 0 0 35px; color: #8A8A8A; font-size: 28px; letter-spacing: 5px; text-transform: uppercase; }
h1 { margin: 0; font-weight: 400; font-size: 118px; line-height: .97; text-transform: uppercase; }
h1 span { display: block; }
.accent { color: #FF4757; }
.rule { width: 90px; margin: 35px auto 25px; border-top: 2px solid #FF4757; }
.caption { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
<main>
<div class="content">
<p class="label">Veille hebdomadaire</p>
<h1><span>Veille</span><span class="accent">Stratégique</span><span>IA &amp; Web</span></h1>
<div class="rule"></div>
<p class="caption">Éclairer les décisions digitales</p>
</div>
</main>
</body>
</html>
